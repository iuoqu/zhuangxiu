<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>空间规划 MVP</title>
<style>
:root{--bg:#f4f5f7;--paper:#fff;--ink:#17202a;--muted:#667085;--line:#dfe3e8;--blue:#2563eb;--red:#dc2626;--amber:#d97706;--green:#15803d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif}.top{height:58px;background:#17202a;color:#fff;display:flex;align-items:center;padding:0 20px;gap:16px}.top b{font-size:16px}.top span{color:#bac3ce;font-size:12px}.top .spacer{flex:1}.top button,.btn{border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:7px 10px;cursor:pointer;font:inherit}.top button{border-color:#52606d;background:transparent;color:#fff}.top button.primary,.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.app{height:calc(100vh - 58px);display:grid;grid-template-columns:232px 1fr 290px;min-height:620px}.left,.right{background:var(--paper);overflow:auto;padding:16px;border-right:1px solid var(--line)}.right{border-left:1px solid var(--line);border-right:0}.main{min-width:0;display:flex;flex-direction:column}.section{margin:0 0 20px}.section h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tool{text-align:left;background:#fff;border:1px solid var(--line);border-radius:7px;padding:9px;cursor:pointer;color:var(--ink)}.tool.active{border-color:var(--blue);color:var(--blue);background:#eff6ff}.tool small{display:block;color:var(--muted);margin-top:2px;font-size:11px}.field{margin:9px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.field input,.field select{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit}.row{display:flex;gap:7px}.row>*{min-width:0;flex:1}.canvasbar{height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:0 14px}.canvasbar .spacer{flex:1}.canvasbox{position:relative;flex:1;min-height:0;background:#e9eef3;overflow:hidden}.canvasbox canvas{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;left:14px;bottom:14px;background:#fffdf; background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:7px;padding:7px 9px;color:var(--muted);font-size:12px}.tabs{display:flex;gap:4px}.tabs button{border:0;background:transparent;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--muted)}.tabs button.active{color:var(--blue);background:#eff6ff;font-weight:600}.status{font-size:12px;padding:9px 10px;border-radius:7px;margin:8px 0;background:#f8fafc;border:1px solid var(--line)}.status.bad{background:#fef2f2;border-color:#fecaca;color:#991b1b}.status.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}.status.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}.list{display:grid;gap:6px}.item{display:flex;justify-content:space-between;gap:8px;padding:8px;border:1px solid var(--line);border-radius:7px}.item button{padding:0;border:0;background:transparent;color:var(--red);cursor:pointer}.metric{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0}.metric b{font-variant-numeric:tabular-nums}.empty{color:var(--muted);font-size:12px}.notice{padding:10px;border-radius:7px;background:#eff6ff;color:#1e40af;font-size:12px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:20px;z-index:2}.modal[hidden]{display:none}.dialog{background:#fff;border-radius:12px;width:min(440px,100%);padding:20px;box-shadow:0 18px 60px rgba(0,0,0,.25)}.dialog h1{font-size:18px;margin:0 0 4px}.dialog p{color:var(--muted);margin:0 0 16px}@media(max-width:900px){.app{grid-template-columns:205px 1fr}.right{display:none}}@media(max-width:620px){.app{grid-template-columns:1fr}.left{display:none}}
</style>
</head>
<body>
<header class="top"><b>办公空间规划</b><span>MVP · 本地自动保存</span><span class="spacer"></span><button id="newProject">新建项目</button><button id="importBtn">导入</button><button id="exportBtn">导出</button><button class="primary" id="shareBtn">复制只读链接</button><input id="fileInput" type="file" accept="application/json" hidden></header>
<div class="app">
<aside class="left">
  <div class="section"><h2>绘制工具</h2><div class="tools" id="tools">
    <button class="tool active" data-tool="select">选择<small>移动 / 删除</small></button><button class="tool" data-tool="wall">墙体<small>拖出一段墙</small></button>
    <button class="tool" data-tool="door">门<small>点墙放置</small></button><button class="tool" data-tool="window">窗户<small>点墙放置</small></button>
    <button class="tool" data-tool="partition">隔断<small>拖出隔断</small></button><button class="tool" data-tool="column">柱体<small>拖出矩形</small></button>
    <button class="tool" data-tool="corridor">通道<small>拖出净空区</small></button><button class="tool" data-tool="exit">安全出口<small>点墙标记</small></button>
    <button class="tool" data-tool="blocked">禁占区<small>拖出矩形</small></button>
  </div></div>
  <div class="section"><h2>生成概念初稿</h2>
    <div class="field"><label>目标员工数</label><input id="briefPeople" type="number" value="36" min="4" max="300"></div>
    <div class="field"><label>办公模式</label><select id="briefMode"><option value="hybrid">混合办公</option><option value="open">开放式优先</option><option value="private">私密性优先</option></select></div>
    <div class="row"><div class="field"><label>会议席位</label><input id="briefMeeting" type="number" value="12" min="0" max="60"></div><div class="field"><label>电话亭</label><input id="briefPhone" type="number" value="2" min="0" max="20"></div></div>
    <button class="btn primary" id="generateDrafts" style="width:100%">生成 A / B / C 初稿</button>
    <p class="empty" style="margin:8px 0 0">初稿是辅助决策布局，需在深化设计前核验现场与消防条件。</p>
  </div>
  <div class="section"><h2>家具库</h2><div class="tools" id="catalog"></div></div>
  <div class="section"><h2>项目规则</h2><div class="field"><label>主通道最小净宽 mm</label><input id="mainClear" type="number" value="1200" step="50"></div><div class="field"><label>次通道最小净宽 mm</label><input id="minorClear" type="number" value="900" step="50"></div><div class="notice">校核仅用于辅助规划，不能替代消防规范审核或专业设计确认。</div></div>
</aside>
<main class="main"><div class="canvasbar"><div class="tabs"><button class="active" data-view="2d">2D 平面</button><button data-view="3d">3D 预览</button></div><span class="spacer"></span><button class="btn" id="fitBtn">适应画布</button><button class="btn" id="undoBtn">撤销</button></div><div class="canvasbox"><canvas id="canvas"></canvas><div class="hint" id="hint">滚轮缩放 · 按住空格拖动画布 · 拖动工具创建对象</div></div></main>
<aside class="right"><div class="section"><h2>概念方案</h2><div id="drafts" class="list"><div class="empty">填写需求后生成初稿。</div></div></div><div class="section"><h2>选中对象</h2><div id="inspector" class="empty">选择一个对象以查看尺寸和位置。</div></div><div class="section"><h2>方案检查</h2><div id="checks"></div></div><div class="section"><h2>统计与清单</h2><div id="stats"></div><div id="bom" class="list" style="margin-top:10px"></div></div></aside>
</div>
<div class="modal" id="projectModal"><form class="dialog" id="projectForm"><h1>建立办公场地</h1><p>先输入净尺寸。建立后仍可通过墙体、门窗、柱体和禁占区继续调整。</p><div class="row"><div class="field"><label>项目名称</label><input id="projectName" value="未命名办公空间" required></div></div><div class="row"><div class="field"><label>宽度 mm</label><input id="siteWidth" type="number" min="3000" value="18000" required></div><div class="field"><label>深度 mm</label><input id="siteHeight" type="number" min="3000" value="12000" required></div></div><div class="row"><button type="button" class="btn" id="cancelProject">取消</button><button class="btn primary" style="flex:1">建立场地</button></div></form></div>
<script src="studio.js"></script>
</body></html>
