<style>
  :root{ --bg:#f6f6f4; --card:#fff; --ink:#1c1f22; --dim:#6b7075; --line:#e3e3df;
         --accent:#1f5fa8; --warn:#a8541f; --ok:#2c7a4b;
         --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#16181a; --card:#1e2124; --ink:#e8e8e6; --dim:#9aa0a6; --line:#2e3236;
           --accent:#6aa9e9; --warn:#e0a06a; --ok:#6fc08d; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .navbar{position:sticky;top:0;z-index:60;display:flex;gap:10px;align-items:center;
          padding:8px 20px;border-bottom:1px solid var(--line);
          background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);font-size:13.5px}
  .navbar a{padding:5px 12px;border-radius:7px;text-decoration:none;color:var(--dim)}
  .navbar a.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}
  .navbar .gap{flex:1}
  .navbar .who{font-size:12px;color:var(--dim)}

  .wrap{max-width:1500px;margin:0 auto;padding:18px 20px 40px}
  h1{font-size:19px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 14px}
  .cols{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
  @media (max-width:1000px){.cols{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  canvas{display:block;width:100%;background:var(--card);border-radius:8px;cursor:crosshair;touch-action:none}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  button{padding:7px 13px;border:1px solid var(--line);border-radius:7px;background:transparent;
         color:var(--ink);font:13.5px system-ui;cursor:pointer}
  button.on{border-color:var(--accent);color:var(--accent);font-weight:600;
            background:color-mix(in srgb,var(--accent) 10%,transparent)}
  button.go{border:0;background:var(--accent);color:#fff;font-weight:600}
  select,input[type=text],input[type=number]{padding:6px 9px;border:1px solid var(--line);
         border-radius:6px;background:var(--card);color:var(--ink);font:13.5px system-ui}
  label.f{display:block;font-size:12px;color:var(--dim);margin:10px 0 3px}
  .chk{margin-top:8px;font-size:12.5px;line-height:1.7;color:var(--dim)}
  .chk b{color:var(--ink)}
  .chk .bad{color:var(--warn);font-weight:500}
  .chk .good{color:var(--ok)}
  .rotbtn{position:absolute;width:26px;height:26px;padding:0;display:flex;align-items:center;
    justify-content:center;border-radius:50%;border:1px solid var(--accent);background:var(--card);
    color:var(--accent);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.18);z-index:3}
  .rotbtn:hover{background:var(--accent);color:#fff}
  .rotbtn:active{transform:scale(.92)}
  #q_alt button{display:block;width:100%;text-align:left;margin-top:5px;padding:6px 9px;font-size:12.5px;
    background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--ink);cursor:pointer}
  #q_alt button small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
  #q_alt button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .stat{font:12.5px/1.9 var(--mono);color:var(--dim)}
  .stat b{color:var(--ink);font-size:15px}
  .rows{margin-top:8px;font-size:12.5px;max-height:230px;overflow:auto}
  .rows div{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}
  .rows span:first-child{flex:1}
  .rows .num{font:12px var(--mono);color:var(--dim)}
  .hint{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.7}
  .msg{margin-top:10px;padding:9px 12px;border-radius:8px;font-size:13px;display:none}
  .msg.on{display:block;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}

  #pgate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;
         padding:20px;background:var(--bg)}
  #pgate[hidden]{display:none}
  #pgate .box{width:100%;max-width:340px;text-align:center;background:var(--card);
              border:1px solid var(--line);border-radius:10px;padding:22px}
  #pgate input{width:100%;margin:14px 0 10px;padding:12px;font:600 26px/1 var(--mono);
       letter-spacing:.5em;text-align:center;text-indent:.5em;
       border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
  #pgate button{width:100%;background:var(--accent);color:#fff;border:0;padding:11px;font-weight:600}
  #pgate .err{margin-top:10px;font-size:13px;color:var(--warn);min-height:1.2em}
</style>

</div></div>

<div class="wrap">
  <h1>排布</h1>
  <p class="sub">灰色是<b>固定底板</b> —— 结构、幕墙、电梯、楼梯、厕所、客房，怎么排都不动，锁死不可选。
     其余都在你手里：拉房间、刷工位带，右边实时报面积和工位数。</p>

  <div class="cols">
    <div class="card">
      <div class="bar">
        <button id="t_sel" class="on">选择</button>
        <button id="t_room">＋ 房间</button>
        <button id="t_desk">＋ 工位带</button>
        <button id="t_hall">＋ 走廊</button>
        <span style="width:12px"></span>
        <label style="font-size:12.5px;display:flex;align-items:center;gap:4px;cursor:pointer"
               title="按净宽染色：红 &lt;1200、黄 1200~1800、绿 ≥1800">
          <input type="checkbox" id="showwalk"> 动线<small style="color:var(--dim)">（红=窄）</small></label>
        <span style="width:12px"></span>
        <button id="del">删除选中</button>
        <span class="gap" style="flex:1"></span>
        <select id="load"><option value="">载入…</option>
          <option value="A">PLAN A（甲方 0828）</option>
          <option value="B">PLAN B（甲方 0828）</option>
          <option value="_">空白</option></select>
        <input type="text" id="sid" value="C" maxlength="8" style="width:56px" title="方案号">
        <button id="save" class="go">存进仓库</button>
        <button id="exp">导出文件</button>
      </div>
      <div id="cvwrap" style="position:relative">
        <canvas id="cv"></canvas>
        <button id="rot" class="rotbtn" hidden title="转 90°（R）" aria-label="转 90°">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11a8 8 0 1 0-2.3 6.3"/><polyline points="20 5 20 11 14 11"/>
          </svg>
        </button>
      </div>
      <div id="chk" class="chk"></div>
      <p class="hint">拖 = 画／移动　·　拖角 = 改大小　·　Del = 删　·　点「可拆」房间 = 拆掉它　·　选中后点 ↻ 或按 R = 转 90°　·　吸附 50 mm</p>
      <div class="msg" id="msg"></div>
    </div>

    <div class="card">
      <details id="gen" open>
        <summary style="cursor:pointer;font-size:13.5px;font-weight:600">按需求生成</summary>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:10px">
          <div><label class="f">工位数</label><input type="number" id="q_seat" value="50" min="0" max="140" style="width:100%"></div>
          <div><label class="f">桌面</label><select id="q_desk" style="width:100%">
            <option value="1400,700">1400×700</option>
            <option value="1500,750" selected>1500×750</option>
            <option value="1600,800">1600×800</option></select></div>
          <div><label class="f">大会议 人</label><input type="number" id="q_big" value="14" min="0" max="30" style="width:100%"></div>
          <div><label class="f">中会议 人</label><input type="number" id="q_mid" value="12" min="0" max="24" style="width:100%"></div>
          <div><label class="f">洽谈 间数</label><input type="number" id="q_tn" value="4" min="0" max="8" style="width:100%"></div>
          <div><label class="f">洽谈 每间人</label><input type="number" id="q_tp" value="4" min="2" max="10" style="width:100%"></div>
          <div><label class="f">茶水间 ㎡</label><input type="number" id="q_tea" value="16" min="0" max="60" style="width:100%"></div>
          <div><label class="f">打印储物 ㎡</label><input type="number" id="q_print" value="0" min="0" max="30" style="width:100%"></div>
          <div><label class="f">电话亭 个</label><input type="number" id="q_booth" value="0" min="0" max="6" style="width:100%"></div>
          <div><label class="f">主通道 mm</label><input type="number" id="q_spine" value="1800" step="100" style="width:100%"></div>
          <div><label class="f">次通道 mm</label><input type="number" id="q_cross" value="1200" step="100" min="900" style="width:100%"></div>
          <div><label class="f">每段最多 桌</label><input type="number" id="q_seg" value="6" min="2" max="12" style="width:100%"></div>
          <div style="grid-column:1/-1"><label class="f">偏好</label><select id="q_pref" style="width:100%">
            <option>均衡</option><option>采光优先</option><option>数量优先</option><option>房间优先</option></select></div>
        </div>
        <button class="go" id="q_go" style="width:100%;margin-top:10px">生成排布</button>
        <div class="hint" id="q_out"></div>
        <div id="q_alt"></div>
      </details>
      <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">

      <div class="stat">工位 <b id="seats">0</b> 个　·　房间 <b id="nroom">0</b> 间</div>
      <div class="stat">可变区 316.9 ㎡　已排房间 <b id="aroom">0</b> ㎡</div>

      <div id="ins">
        <label class="f">选中的是</label>
        <select id="rname"></select>
        <div id="deskset" hidden>
          <label class="f">桌面（mm）</label>
          <select id="dsize">
            <option value="1400,700" selected>1400 × 700</option>
            <option value="1500,750">1500 × 750</option>
            <option value="1600,800">1600 × 800</option>
          </select>
          <label class="f">朝向</label>
          <select id="dir"><option value="h">横排（背靠背沿 X）</option>
                           <option value="v">竖排（背靠背沿 Y）</option></select>
          <div id="faceset" hidden>
            <label class="f">椅子在（单排带）</label>
            <select id="dface"></select>
          </div>
        </div>

        <div class="stat" id="sel" style="margin-top:10px">没选中</div>
      </div>

      <div class="rows" id="list"></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const NAMES = ['大会议室','中会议室','小会议室','洽谈室','茶水间','协作区','前台','储物',
               '电话亭','打印区','经理室','其他'];
let BASE = null, SCH = {id:'新', name:'未命名', demolish:[], rooms:[], desks:[]};
let tool = 'sel', sel = null, drag = null;
const SNAP = 50;
const cv = $('#cv'), ctx = cv.getContext('2d');
let VIEW = {s:1, ox:0, oy:0};

// ---- 视图：把 28.2 × 21.5 m 的楼板铺满画布
function layout(){
  const W = cv.clientWidth, H = Math.round(W * 21501 / 28200);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const b = BASE.shell, pad = 14;
  VIEW.s = Math.min((W - pad*2) / (b.x1 - b.x0), (H - pad*2) / (b.y1 - b.y0));
  VIEW.ox = pad - b.x0 * VIEW.s; VIEW.oy = pad - b.y0 * VIEW.s;
}
const px = (x, y) => [x * VIEW.s + VIEW.ox, y * VIEW.s + VIEW.oy];
const mm = (X, Y) => [(X - VIEW.ox) / VIEW.s, (Y - VIEW.oy) / VIEW.s];
const snap = v => Math.round(v / SNAP) * SNAP;
const area = r => ((r.x[1]-r.x[0]) * (r.y[1]-r.y[0]) / 1e6);

// ---- 可拆房间：甲方点名机房／清扫间／备餐间／餐厅（茶水间）都能拆。
// 拆了写进方案的 demolish 里，白模和 AI 底图跟着不画那几堵墙。
const allDemo = () => (BASE ? BASE.rooms : []).filter(r => r.lock === 'demo').map(r => r.n);
// 新方案默认就把这四间拆了 —— 甲方点名可拆，自己的 PLAN A／B 也已经在拆，
// 留着反而是特例。想留哪间，在图上点一下就回来。
const blank = () => ({id:'新', name:'未命名', demolish: allDemo(), rooms:[], desks:[], halls:[]});
const gone = n => (SCH.demolish || []).includes(n);
const unlocked = f => !(f.unlock || []).some(n => !gone(n));   // 这块地要拆的都拆了才算腾出来
function toggleDemo(n){
  const d = new Set(SCH.demolish || []);
  d.has(n) ? d.delete(n) : d.add(n);
  SCH.demolish = [...d];
  const got = BASE.free.filter(unlocked).filter(f => (f.unlock||[]).length)
                       .reduce((a, f) => a + area(f), 0);
  show(gone(n) ? `拆掉「${n}」。腾出来的地方共 ${got.toFixed(1)} ㎡，可以往里排东西了。`
               : `「${n}」留着。`);
  sync();
}

// ---- 画
function rect(r, fill, stroke, wd){
  const [a,b] = px(r.x[0], r.y[0]), [c,d] = px(r.x[1], r.y[1]);
  if (fill){ ctx.fillStyle = fill; ctx.fillRect(a, b, c-a, d-b); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = wd || 1; ctx.strokeRect(a, b, c-a, d-b); }
  return [a,b,c,d];
}
function chairDot(s){
  // 椅子画成桌子外侧的一个小半圆 —— 人坐哪边一眼看得出来，转 90° 之后尤其
  const [a,b] = px(s.x[0], s.y[0]), [c,d] = px(s.x[1], s.y[1]);
  const w = c-a, h = d-b, r = Math.min(w, h) * 0.3;
  if (r < 1.5) return;
  const p = {N:[(a+c)/2, b-r*0.9], S:[(a+c)/2, d+r*0.9], W:[a-r*0.9, (b+d)/2], E:[c+r*0.9, (b+d)/2]}[s.face || 'N'];
  ctx.fillStyle = 'color-mix(in srgb,' + getComputedStyle(document.body).getPropertyValue('--dim').trim() + ' 55%,transparent)';
  ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 6.284); ctx.fill();
}
function label(r, t, col, sz){
  const [a,b,c,d] = [...px(r.x[0], r.y[0]), ...px(r.x[1], r.y[1])];
  ctx.fillStyle = col; ctx.font = `${sz||11}px system-ui`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (c-a > 34 && d-b > 14) ctx.fillText(t, (a+c)/2, (b+d)/2);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}
let WALK = null;

/** 每改一下就重算一遍：拖一间会议室堵死通道、拖到柱子上、压住客房，
    原来页面一声不吭 —— 只有勾了「动线」才看得出来。现在一直挂在画布下面。 */
function checkAll(){
  if (!BASE) return;
  const bad = [], all = SCH.rooms.concat(SCH.desks, SCH.halls || []);
  const FX = BASE.rooms.filter(r => !gone(r.n)).concat([BASE.entry]);
  const CS = colRects(), CL = (BASE.clear || []).map(c => {
    const d = +(($('#q_spine') || {}).value) || c.depth || 1800;
    return c.edge === 'W' ? {...c, x:[c.x[1] - d, c.x[1]]} : c; });
  const name = o => o.n || (SCH.desks.includes(o) ? '工位带' : '走廊');
  const hitList = (o, list, what, as) => { const h = list.filter(f => hits(o, f));
    if (h.length) bad.push(`<span class="bad">${name(as || o)} 压住${what}${h[0].n ? '「'+h[0].n+'」' : ''}</span>`); };
  for (const o of SCH.rooms.concat(SCH.desks)){
    hitList(o, FX, '');
    hitList(o, CL, '');
    // 柱子：房间按装箱那套判 —— 砌进墙里（离边 400 以内）是正常做法，不报；
    // 杵到房间中间才报。工位带没有墙可以藏柱子，碰到就是碰到。
    const isRoom = SCH.rooms.includes(o);
    const inner = isRoom ? {x:[o.x[0]+400, o.x[1]-400], y:[o.y[0]+400, o.y[1]-400]} : o;
    if (inner.x[1] > inner.x[0] && inner.y[1] > inner.y[0]) hitList(inner, CS, '结构柱', o);
  }
  for (let i = 0; i < all.length; i++) for (let j = i+1; j < all.length; j++)
    if (hits(all[i], all[j])) { bad.push(`<span class="bad">${name(all[i])} 和 ${name(all[j])} 重叠</span>`); i = all.length; break; }
  const w = reach(SCH.rooms, SCH.desks, true);
  WALK = w;
  const parts = [`工位 <b>${seatCount()}</b>　房间 <b>${SCH.rooms.length}</b> 间`];
  if (SCH.rooms.length || SCH.desks.length){
    parts.push(w.lost ? `<span class="bad">${w.lost} 处从门厅走不到</span>` : '<span class="good">动线通</span>');
    if (w.far) parts.push(`最远疏散（沿走道）<b>${(w.far/1000).toFixed(1)} m</b>`
      + (w.far > BASE.egress_max ? ' <span class="bad">超 27.5</span>' : ' <span class="good">✓</span>'));
    if (w.narrow != null) parts.push(`疏散路上最窄 <b>${w.narrow}</b> mm`
      + (w.narrow < 1200 ? ' <span class="bad">窄于次通道 1200</span>' : ' <span class="good">✓</span>'));
  }
  $('#chk').innerHTML = parts.concat(bad.slice(0, 4)).join('　·　');
}

function draw(){
  const dim = getComputedStyle(document.body).getPropertyValue('--dim').trim();
  const ink = getComputedStyle(document.body).getPropertyValue('--ink').trim();
  const line = getComputedStyle(document.body).getPropertyValue('--line').trim();
  const acc = getComputedStyle(document.body).getPropertyValue('--accent').trim();
  const warn = getComputedStyle(document.body).getPropertyValue('--warn').trim() || '#c2410c';
  const ok = getComputedStyle(document.body).getPropertyValue('--ok').trim() || '#2c7a4b';
  ctx.clearRect(0, 0, cv.width, cv.height);

  rect({x:[BASE.shell.x0,BASE.shell.x1], y:[BASE.shell.y0,BASE.shell.y1]}, null, line, 1);
  // 可变区。要先拆房间才腾得出来的那几块，拆之前不上底色。
  for (const f of BASE.free)
    if (unlocked(f)) rect(f, 'color-mix(in srgb,'+acc+' 5%,transparent)', null);
  // 幕墙：三个立面上的玻璃段
  ctx.strokeStyle = acc; ctx.lineWidth = 3;
  const g = BASE.glazing;
  for (const [a,b] of g.north){ const p=px(a,g.north_y), q=px(b,g.north_y);
    ctx.beginPath(); ctx.moveTo(...p); ctx.lineTo(...q); ctx.stroke(); }
  for (const [a,b] of g.south){ const p=px(a,g.south_y), q=px(b,g.south_y);
    ctx.beginPath(); ctx.moveTo(...p); ctx.lineTo(...q); ctx.stroke(); }
  for (const [a,b] of g.west){ const p=px(g.west_x,a), q=px(g.west_x,b);
    ctx.beginPath(); ctx.moveTo(...p); ctx.lineTo(...q); ctx.stroke(); }
  // 固定房间。lock='demo' 的四间（机房／清扫／备餐／餐厅）甲方说了可以拆 ——
  // 拆掉的画成红色虚框，没拆的照常，点它就能拆。
  for (const r of BASE.rooms.concat([BASE.entry])){
    if (r.lock === 'demo' && gone(r.n)){
      ctx.save(); ctx.setLineDash([4, 3]);
      rect(r, null, 'color-mix(in srgb,'+warn+' 55%,transparent)', 1);
      ctx.restore();
      label(r, r.n + ' 已拆', 'color-mix(in srgb,'+warn+' 70%,transparent)', 10.5);
      continue;
    }
    const lock = r.lock === 'fixed';
    rect(r, lock ? 'color-mix(in srgb,'+dim+' 26%,transparent)'
                 : 'color-mix(in srgb,'+dim+' 12%,transparent)', line, 1);
    label(r, r.lock === 'demo' ? r.n + ' 可拆' : r.n, dim, 10.5);
  }
  // 实际动线：从门厅出发人能走到的地方。看通不通、哪儿被卡细了。
  if (WALK && $('#showwalk').checked && WALK.seen){
    // 按净宽分三档上色：红 <1200 过得去但挤、黄 1200~1800 次通道、绿 ≥1800 主通道。
    // 一格一格 fillRect 的话半透明会在接缝上叠出网格，所以整段扫成一条汇进 Path2D。
    const {seen, W, H, X0, Y0} = WALK, wf2 = widthField(WALK);
    const band = k => { const v = wf2[k]; return v < 1200 ? 0 : v < 1800 ? 1 : 2; };
    const paths = [new Path2D(), new Path2D(), new Path2D()];
    for (let j = 0; j < H; j++){
      let i = 0;
      while (i < W){
        if (!seen[j*W+i]){ i++; continue; }
        const g = band(j*W+i);
        let e = i; while (e < W && seen[j*W+e] && band(j*W+e) === g) e++;
        const [a, b] = px(X0 + i*GRID, Y0 + j*GRID), [c, d] = px(X0 + e*GRID, Y0 + (j+1)*GRID);
        paths[g].rect(a, b, c-a+0.5, d-b+0.5);
        i = e;
      }
    }
    const fills = ['color-mix(in srgb,'+warn+' 38%,transparent)',
                   'color-mix(in srgb,'+ok+' 16%,transparent)',
                   'color-mix(in srgb,'+ok+' 30%,transparent)'];
    for (let g = 2; g >= 0; g--){ ctx.fillStyle = fills[g]; ctx.fill(paths[g]); }
  }
  // 必须空着的地方。只画底板自带的（门厅进场）—— 手钉的走廊上面已经画过一遍了，
  // clearRects() 把两者并在一起是给装箱用的，拿它来画会把走廊画重、标签叠字。
  for (const c of clearRects().filter(c => !(SCH.halls || []).includes(c))){
    ctx.save(); ctx.setLineDash([5, 4]);
    rect(c, 'color-mix(in srgb,'+acc+' 7%,transparent)', 'color-mix(in srgb,'+acc+' 45%,transparent)', 1);
    ctx.restore();
    label(c, c.n, 'color-mix(in srgb,'+acc+' 70%,transparent)', 10.5);
  }
  // 柱
  for (const c of BASE.columns) rect({x:[c.x,c.x+c.w], y:[c.y,c.y+c.d]}, ink, null);

  // 方案层：先画走廊（垫在底下）
  for (const h of (SCH.halls || [])){
    const on = sel === h, w = Math.min(h.x[1]-h.x[0], h.y[1]-h.y[0]);
    ctx.save(); ctx.setLineDash([6, 4]);
    rect(h, 'color-mix(in srgb,'+dim+' 10%,transparent)', on ? acc : 'color-mix(in srgb,'+dim+' 45%,transparent)', on ? 2.5 : 1);
    ctx.restore();
    label(h, `走廊 ${w}`, dim, 10.5);
  }
  for (const r of SCH.rooms){
    const on = sel === r;
    rect(r, 'color-mix(in srgb,'+acc+' 14%,transparent)', on ? acc : line, on ? 2.5 : 1.4);
    label(r, `${r.n} ${area(r).toFixed(1)}㎡`, ink, 11);
  }
  for (const d of SCH.desks){
    const on = sel === d;
    rect(d, null, on ? acc : dim, on ? 2.5 : 1.2);
    for (const s of seatsOf(d)){
      rect(s, 'color-mix(in srgb,'+ink+' 16%,transparent)', 'color-mix(in srgb,'+ink+' 35%,transparent)', 0.6);
      chairDot(s);
    }
  }
  if (drag && drag.rect) rect(drag.rect, null, acc, 1.5);
  placeRot();
}

/** 转 90° 的按钮贴在选中块的右上角外侧 —— 放在右边面板里离得太远，
    改完还得把视线拉回来。贴着块走，拖动时也跟着。 */
function placeRot(){
  const btn = $('#rot');
  if (!sel){ btn.hidden = true; return; }
  const [x1, y0] = px(Math.max(...sel.x), Math.min(...sel.y));
  const S = 26, W = cv.clientWidth, H = cv.clientHeight;
  btn.hidden = false;
  btn.style.left = Math.max(2, Math.min(W - S - 2, x1 - S / 2)) + 'px';
  btn.style.top  = Math.max(2, Math.min(H - S - 2, y0 - S / 2)) + 'px';
}

// ---- 工位带 → 一张张桌子
function seatsOf(d){
  const [w, h] = (d.size || [1400, 700]);
  const dir = d.dir || 'h';
  const out = [];
  const X0 = Math.min(...d.x), X1 = Math.max(...d.x), Y0 = Math.min(...d.y), Y1 = Math.max(...d.y);
  // 带够深就背靠背两排一组（组间留座椅＋通行 1800）；只有一张桌深就铺单排 ——
  // 甲方图里靠墙、靠茶水台那两条就是单排，按双排算会少数 8 个工位。
  // face = 椅子在桌子的哪一侧（人坐这边）。背靠背两排：前排椅子朝外，后排也朝外，
  // 屏风夹在中间。单排带的朝向由 d.face 定 —— 靠墙那条，人得背对墙坐。
  if (dir === 'h'){
    const one = (Y1 - Y0) < h * 2 - 50;
    const pitch = one ? h + 1800 : h * 2 + 1800;
    for (let y = Y0; y + (one ? h : h * 2) <= Y1 + 50; y += pitch)
      for (let x = X0; x + w <= X1 + 50; x += w){
        out.push({x:[x, x+w], y:[y, y+h], face: one ? (d.face || 'N') : 'N'});
        if (!one) out.push({x:[x, x+w], y:[y+h, y+h*2], face:'S'});
      }
  } else {
    const one = (X1 - X0) < h * 2 - 50;
    const pitch = one ? h + 1800 : h * 2 + 1800;
    for (let x = X0; x + (one ? h : h * 2) <= X1 + 50; x += pitch)
      for (let y = Y0; y + w <= Y1 + 50; y += w){
        out.push({x:[x, x+h], y:[y, y+w], face: one ? (d.face || 'W') : 'W'});
        if (!one) out.push({x:[x+h, x+h*2], y:[y, y+w], face:'E'});
      }
  }
  return out;
}
const isSingle = d => { const [w, h] = (d.size || [1400,700]);
  return ((d.dir||'h') === 'h' ? d.y[1]-d.y[0] : d.x[1]-d.x[0]) < h * 2 - 50; };

/** 整条带（或整间房）绕中心转 90°，框和朝向一起转。 */
function turn(o){
  const cx = (o.x[0]+o.x[1])/2, cy = (o.y[0]+o.y[1])/2;
  const w = o.x[1]-o.x[0], h = o.y[1]-o.y[0];
  o.x = [snap(cx - h/2), snap(cx - h/2) + h];
  o.y = [snap(cy - w/2), snap(cy - w/2) + w];
  if (SCH.desks.includes(o)){
    o.dir = (o.dir||'h') === 'h' ? 'v' : 'h';
    if (o.face) o.face = {N:'E', E:'S', S:'W', W:'N'}[o.face];
  }
}
const seatCount = () => SCH.desks.reduce((n, d) => n + seatsOf(d).length, 0);

// ---- 面板
function sync(){
  $('#seats').textContent = seatCount();
  $('#nroom').textContent = SCH.rooms.length;
  $('#aroom').textContent = SCH.rooms.reduce((a, r) => a + area(r), 0).toFixed(1);
  const L = $('#list'); L.innerHTML = '';
  for (const r of SCH.rooms)
    L.insertAdjacentHTML('beforeend',
      `<div><span>${r.n}</span><span class="num">${(r.x[1]-r.x[0])}×${(r.y[1]-r.y[0])}</span>`
      + `<span class="num">${area(r).toFixed(1)} ㎡</span></div>`);
  SCH.desks.forEach((d, i) => L.insertAdjacentHTML('beforeend',
      `<div><span>工位带 ${i+1}</span><span class="num">${(d.size||[1400,700]).join('×')}</span>`
      + `<span class="num">${seatsOf(d).length} 位</span></div>`));
  const s = $('#sel');
  if (!sel){ s.textContent = '没选中'; $('#deskset').hidden = true; $('#rname').disabled = true; }
  else if ((SCH.halls || []).includes(sel)){
    $('#deskset').hidden = true; $('#rname').disabled = true;
    const w = Math.min(sel.x[1]-sel.x[0], sel.y[1]-sel.y[0]);
    s.textContent = `走廊　净宽 ${w} mm　${w < 1200 ? '← 窄于 1200，过不去' : w < 1800 ? '（次通道）' : '（主通道）'}`;
  }
  else if (SCH.rooms.includes(sel)){
    $('#deskset').hidden = true; $('#rname').disabled = false; $('#rname').value = sel.n;
    s.textContent = `${sel.x[1]-sel.x[0]} × ${sel.y[1]-sel.y[0]} mm = ${area(sel).toFixed(1)} ㎡`;
  } else {
    $('#deskset').hidden = false; $('#rname').disabled = true;
    $('#dsize').value = (sel.size||[1400,700]).join(',');
    $('#dir').value = sel.dir || 'h';
    const one = isSingle(sel);
    $('#faceset').hidden = !one;
    if (one){
      const opt = (sel.dir||'h') === 'h' ? [['N','上（北）'],['S','下（南）']] : [['W','左（西）'],['E','右（东）']];
      $('#dface').innerHTML = opt.map(([v,t]) => `<option value="${v}">${t}</option>`).join('');
      $('#dface').value = sel.face || opt[0][0];
    }
    s.textContent = `${sel.x[1]-sel.x[0]} × ${sel.y[1]-sel.y[0]} mm　${seatsOf(sel).length} 个工位`
                  + (one ? '　单排' : '　背靠背');
  }
  checkAll();
  draw();
}

// ---- 交互
function hit(x, y){
  for (const r of [...SCH.desks].reverse().concat([...SCH.rooms].reverse(), [...(SCH.halls||[])].reverse()))
    if (x >= r.x[0] && x <= r.x[1] && y >= r.y[0] && y <= r.y[1]) return r;
  return null;
}
function corner(r, x, y){
  const t = 12 / VIEW.s;
  return Math.abs(x - r.x[1]) < t && Math.abs(y - r.y[1]) < t;
}
cv.addEventListener('pointerdown', e => {
  const b = cv.getBoundingClientRect();
  const [x, y] = mm(e.clientX - b.left, e.clientY - b.top);
  if (tool === 'sel'){
    const h = hit(x, y);
    // 方案层没点中，落在可拆房间上 → 拆／不拆来回切
    if (!h){
      const d = BASE.rooms.find(r => r.lock === 'demo' &&
        x >= r.x[0] && x <= r.x[1] && y >= r.y[0] && y <= r.y[1]);
      if (d){ sel = null; return toggleDemo(d.n); }
    }
    sel = h;
    if (h) drag = corner(h, x, y) ? {mode:'size', o:h} : {mode:'move', o:h, dx:x-h.x[0], dy:y-h.y[0]};
    sync();
  } else {
    drag = {mode:'new', x0:snap(x), y0:snap(y), rect:{x:[snap(x),snap(x)], y:[snap(y),snap(y)]}};
  }
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const b = cv.getBoundingClientRect();
  let [x, y] = mm(e.clientX - b.left, e.clientY - b.top);
  x = snap(x); y = snap(y);
  if (drag.mode === 'new'){
    drag.rect = {x:[Math.min(drag.x0,x), Math.max(drag.x0,x)],
                 y:[Math.min(drag.y0,y), Math.max(drag.y0,y)]};
  } else if (drag.mode === 'move'){
    const w = drag.o.x[1]-drag.o.x[0], h = drag.o.y[1]-drag.o.y[0];
    drag.o.x = [snap(x-drag.dx), snap(x-drag.dx)+w];
    drag.o.y = [snap(y-drag.dy), snap(y-drag.dy)+h];
  } else {
    drag.o.x[1] = Math.max(drag.o.x[0]+500, x);
    drag.o.y[1] = Math.max(drag.o.y[0]+500, y);
  }
  draw();
});
cv.addEventListener('pointerup', () => {
  if (drag && drag.mode === 'new'){
    const r = drag.rect;
    if (r.x[1]-r.x[0] > 500 && r.y[1]-r.y[0] > 500){
      if (tool === 'hall'){ const o = {n:'走廊', x:r.x, y:r.y}; (SCH.halls = SCH.halls || []).push(o); sel = o;
        show('钉了一条走廊 —— 房间和工位都会绕开它。想让它更窄／更宽拖角就行。'); }
      else if (tool === 'room'){ const o = {n:'大会议室', x:r.x, y:r.y}; SCH.rooms.push(o); sel = o; }
      // 拖得高过宽就是想要竖排 —— 原来一律 dir:'h'，画竖的出来是横的
      else { const o = {x:r.x, y:r.y, size:[1400,700],
                        dir: (r.y[1]-r.y[0]) > (r.x[1]-r.x[0]) ? 'v' : 'h'}; SCH.desks.push(o); sel = o; }
    }
  }
  drag = null; setTool('sel'); sync();
});
addEventListener('keydown', e => {
  if ((e.key === 'r' || e.key === 'R') && sel && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){
    e.preventDefault(); $('#rot').click(); return;
  }
  if (e.key === 'Delete' || e.key === 'Backspace'){
    if (!sel || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    e.preventDefault();
    SCH.rooms = SCH.rooms.filter(r => r !== sel);
    SCH.desks = SCH.desks.filter(r => r !== sel);
    SCH.halls = (SCH.halls || []).filter(r => r !== sel);
    sel = null; sync();
  }
});
function setTool(t){
  tool = t;
  for (const [k, id] of [['sel','#t_sel'],['room','#t_room'],['desk','#t_desk'],['hall','#t_hall']])
    $(id).classList.toggle('on', k === t);
  cv.style.cursor = t === 'sel' ? 'default' : 'crosshair';
}
$('#t_sel').onclick = () => setTool('sel');
$('#t_room').onclick = () => setTool('room');
$('#t_desk').onclick = () => setTool('desk');
$('#t_hall').onclick = () => setTool('hall');
$('#showwalk').onchange = () => sync();
$('#del').onclick = () => { if(!sel) return;
  SCH.rooms = SCH.rooms.filter(r => r !== sel); SCH.desks = SCH.desks.filter(r => r !== sel);
  SCH.halls = (SCH.halls || []).filter(r => r !== sel);
  sel = null; sync(); };
$('#rname').innerHTML = NAMES.map(n => `<option>${n}</option>`).join('');
$('#rname').onchange = e => { if (sel && SCH.rooms.includes(sel)){ sel.n = e.target.value; sync(); } };
$('#dsize').onchange = e => { if (sel){ sel.size = e.target.value.split(',').map(Number); sync(); } };
$('#dir').onchange = e => { if (sel){ sel.dir = e.target.value; delete sel.face; sync(); } };
$('#dface').onchange = e => { if (sel){ sel.face = e.target.value; sync(); } };
$('#rot').onclick = e => { e.stopPropagation(); if (sel){ turn(sel); sync();
  show(`转了 90°　${sel.x[1]-sel.x[0]} × ${sel.y[1]-sel.y[0]} mm`
     + (SCH.desks.includes(sel) ? `　${seatsOf(sel).length} 个工位` : '')); } };

/* ============ 按需求生成 ============
   两条规则都来自 4F 的排布研究，不是拍脑袋的：

   ① 会议室按「桌子」反算，不是按面积。端部净距 1200、侧向净距 1200、
      沿桌长每人 ≥750。房间做方了桌子反而放不长 —— 初稿 5900×6500（38.4 ㎡）
      只能坐 12 人，改成 7450×4200（31.3 ㎡）反而坐 14 人。
      验算：大会议 14 人 → 每侧 6 → 桌 5050×1800 → 房间 7450×4200 ✓ 与报告一致
             中会议 12 人 → 每侧 5 → 桌 4100×1500 → 房间 6500×3900 ✓

   ② 工位按「背靠背带 + 座椅通行区」排。一条带＝两排桌背靠背（2×桌深），
      带与带之间留 1800（两侧各一把椅子 900）。最后一条带后面同样要留 900。 */
// ================================================================ 按需求生成
// 思路：不再写死「有光的区排工位、没光的区排房间」。把每块可变区的各种切法
//（全给工位／全给房间／西头 3~12 m 给房间…）做笛卡尔积，每一种都真排一遍 ——
// 房间用 maxrects 装箱，工位带横竖各试、避柱、每段断口 —— 然后按一个打分挑最好的。
// 打分里有：工位数（差一个比多一个疼 4 倍）、采光、疏散距离、柱子干扰、房间落没落下。
// 调「偏好」就是换一组权重。
const RULE = { end: 1200, side: 1200, per: 750, chair: 1800, trail: 900, head: 1200, light: 6000 };

function tableFor(n){                      // n 人 → [桌长, 桌宽]
  if (n <= 0) return null;
  if (n <= 6) return [n <= 4 ? 1200 : 1400, n <= 4 ? 1200 : 1400];   // 小洽谈：方桌／圆桌
  const perSide = Math.max(1, Math.ceil((n - 2) / 2));
  return [perSide * RULE.per, n >= 13 ? 1800 : 1500];
}
function roomFor(n){                       // n 人 → [房间长, 房间宽]
  const t = tableFor(n);
  if (!t) return null;
  // 小洽谈不必绕着桌子走一圈，净距 750 就够；长条会议桌要留 1200 才推得开椅子。
  // 对图：4 人洽谈 → 2700×2700 = 7.3 ㎡，图上标 7 SQM ✓
  const c = n <= 6 ? 750 : RULE.end;
  return [t[0] + c * 2, t[1] + (n <= 6 ? c : RULE.side) * 2];
}
function seatsIn(r){                       // 反过来：这间房能坐几人
  const L = Math.max(r.x[1]-r.x[0], r.y[1]-r.y[0]) - RULE.end * 2;
  const W = Math.min(r.x[1]-r.x[0], r.y[1]-r.y[0]) - RULE.side * 2;
  if (L < RULE.per || W < 1200) return 0;
  return Math.floor(L / RULE.per) * 2 + 2;
}

// ---- 几何小工具
const hits = (a, b) => a.x[0] < b.x[1] && a.x[1] > b.x[0] && a.y[0] < b.y[1] && a.y[1] > b.y[0];
const colRects = () => BASE.columns.map(c => ({x:[c.x, c.x+c.w], y:[c.y, c.y+c.d]}));
const fixedRects = () => BASE.rooms.filter(r => !gone(r.n)).concat([BASE.entry]);
// 必须空着的地方（门厅进场）。不是墙也不是房间，但房间和工位都不许压上去。
// 深度跟着「主通道」那一栏走 —— 它本来就是一条进场主通道。
const clearRects = () => (BASE.clear || []).map(c => {
  const d = +(($('#q_spine') || {}).value) || c.depth || 1800;
  return c.edge === 'W' ? {...c, x:[c.x[1] - d, c.x[1]]} : c;
}).concat(SCH.halls || []);          // 手钉的走廊同样是禁建区
const mid = r => [(r.x[0]+r.x[1])/2, (r.y[0]+r.y[1])/2];

/** 点到最近幕墙的距离；中间隔着房间（含固定房间）就不算那段。 */
function lightDist(p, blockers){
  const g = BASE.glazing, segs = [];
  for (const [a,b] of g.north) segs.push([a, g.north_y, b, g.north_y]);
  for (const [a,b] of g.south) segs.push([a, g.south_y, b, g.south_y]);
  for (const [a,b] of g.west)  segs.push([g.west_x, a, g.west_x, b]);
  let best = 1e9;
  for (const [x0,y0,x1,y1] of segs){
    const qx = Math.max(x0, Math.min(p[0], x1)), qy = Math.max(y0, Math.min(p[1], y1));
    const dd = Math.hypot(p[0]-qx, p[1]-qy);
    if (dd >= best) continue;
    let blocked = false;                                   // 沿视线取 12 个点看有没有落在房间里
    for (let t = 0.08; t < 0.97 && !blocked; t += 0.08){
      const sx = p[0] + (qx-p[0])*t, sy = p[1] + (qy-p[1])*t;
      blocked = blockers.some(r => sx > r.x[0] && sx < r.x[1] && sy > r.y[0] && sy < r.y[1]);
    }
    if (!blocked) best = dd;
  }
  return best;
}
const exitDist = p => Math.min(...BASE.exits.map(e => Math.hypot(p[0]-e.x, p[1]-e.y)));

/** 离得最近的那片幕墙是哪个朝向的、多远。北／南立面法线沿 Y，西立面沿 X。 */
function nearGlass(p){
  const g = BASE.glazing, segs = [];
  for (const [a,b] of g.north) segs.push([a, g.north_y, b, g.north_y, 'y']);
  for (const [a,b] of g.south) segs.push([a, g.south_y, b, g.south_y, 'y']);
  for (const [a,b] of g.west)  segs.push([g.west_x, a, g.west_x, b, 'x']);
  let best = {d: 1e9, axis: null};
  for (const [x0,y0,x1,y1,ax] of segs){
    const qx = Math.max(x0, Math.min(p[0], x1)), qy = Math.max(y0, Math.min(p[1], y1));
    const d = Math.hypot(p[0]-qx, p[1]-qy);
    if (d < best.d) best = {d, axis: ax};
  }
  return best;
}
/** 房间挡掉的幕墙净长，按「占这片立面的比例」算。

    同样挡 2.7 m 不是一回事：北立面总共 16.2 m，挡掉是 17%；西立面总共才 6.27 m，
    挡掉就是 43% —— 一间 4 人洽谈室吃掉全楼西向采光的一小半。
    再按这间房服务多少人打折：14 人大会议室占窗还说得过去，4 人洽谈室就很亏，
    打印储物电话亭占窗等于白扔。 */
function facadeTotals(){
  const g = BASE.glazing, f = k => g[k].reduce((a, [x, y]) => a + y - x, 0);
  return { north: f('north'), west: f('west'), south: f('south') };
}
function winEat(rooms){
  const g = BASE.glazing, T = facadeTotals(), NEAR = 600;
  const ov = (a0, a1, b0, b1) => Math.max(0, Math.min(a1, b1) - Math.max(a0, b0));
  const eat = { north: 0, west: 0, south: 0 };
  let pen = 0;
  for (const r of rooms){
    const pax = /茶水|协作|休闲/.test(r.n) ? 12 : /打印|储物|电话/.test(r.n) ? 1 : (r.pax || 6);
    const k = 6 / Math.max(1, pax);                 // 服务的人越少，挡窗越亏
    let mine = 0;
    if (Math.abs(r.y[0] - g.north_y) < NEAR){ const v = g.north.reduce((a,[x,y]) => a + ov(r.x[0],r.x[1],x,y), 0);
      eat.north += v; mine += v / T.north; }
    if (Math.abs(r.y[1] - g.south_y) < NEAR){ const v = g.south.reduce((a,[x,y]) => a + ov(r.x[0],r.x[1],x,y), 0);
      eat.south += v; mine += v / T.south; }
    if (Math.abs(r.x[0] - g.west_x)  < NEAR){ const v = g.west.reduce((a,[x,y]) => a + ov(r.y[0],r.y[1],x,y), 0);
      eat.west += v; mine += v / T.west; }
    // 罚款不是线性的：一间房占掉某片立面 15% 以内算正常（总得放点东西），
    // 超过就陡起来 —— 挡一面短立面的 43%，跟十处各挡 4% 完全不是一回事。
    // 线性罚的话，2 个工位（差一个扣 40 分）就能买下半面西窗。
    pen += (mine + 3 * Math.max(0, mine - 0.15)) * 100 * k;
  }
  return { eat, pen, pct: { north: eat.north / T.north, west: eat.west / T.west, south: eat.south / T.south } };
}

/** 眩光：人正对幕墙（一脸光）或背对幕墙（屏幕上一片反光）都不行，侧对才对。
    判据是「视线轴 == 幕墙法线轴」，8 m 以内才算 —— 再远就不是主要光源了。 */
const GLARE_R = 8000;
function glareCount(seats){
  let n = 0;
  for (const s of seats){
    const g = nearGlass(mid(s));
    if (g.d > GLARE_R) continue;
    const viewAxis = (s.face === 'N' || s.face === 'S') ? 'y' : 'x';
    if (viewAxis === g.axis) n++;
  }
  return n;
}

/** 把房间装进若干个空矩形里（maxrects）。两个朝向都试，装不下的标 over。

    原来用「从左往右排、排不下换行」的货架法，第一行被大会议室占掉 4.2 m 之后
    第二行就只剩 2.7 m，中会议室和四间洽谈全落空 —— 实测 6 间里只放进 1 间。
    maxrects 会把剩下的空当继续切成可用矩形，装载率高得多。 */
function pack(zones, items, cross){
  let free = zones.map(z => ({x0:z.x[0], y0:z.y[0], x1:z.x[1], y1:z.y[1]}));
  const out = [], WALL = 100, CS = colRects(), CL = clearRects();   // 隔墙厚，房间之间留一道
  cross = cross || 1200;
  // 柱子可以砌进墙里（离房间边 400 以内），但不能杵在房间中间
  const colInside = (x0, y0, w, d) => CS.some(c => hits({x:[x0+400, x0+w-400], y:[y0+400, y0+d-400]}, c));
  const FX = fixedRects();
  // 打印、储物、电话亭没人久待：先走一遍只准落在离窗 6 m 外的空当（这时候大房间还没
  // 占地方，暗角还空着），没落下的排到最后再正常落。大房间夹在中间按面积从大到小。
  const isSvc = it => /打印|储物|电话/.test(it.n);
  const order = items.filter(isSvc).map(it => ({it, darkOnly:true}))
    .concat(items.filter(it => !isSvc(it)).map(it => ({it})), items.filter(isSvc).map(it => ({it, retry:true})));
  const done = new Set();
  for (const {it, darkOnly, retry} of order){
    if (retry && done.has(it)) continue;
    const svc = isSvc(it);
    let best = null;
    for (const [w, d] of [it.size, [it.size[1], it.size[0]]])
      for (const f of free){
        if (w + WALL > f.x1 - f.x0 || d + WALL > f.y1 - f.y0) continue;
        // 先试贴着左上角；被柱子或门厅进场区挡了，就试着挪到它右边／下边
        const tries = [[f.x0, f.y0]];
        for (const c of CS.concat(CL)) if (hits({x:[f.x0, f.x0+w], y:[f.y0, f.y0+d]}, c)){
          tries.push([c.x[1] + WALL, f.y0]); tries.push([f.x0, c.y[1] + WALL]);
          tries.push([c.x[1] + WALL, c.y[1] + WALL]); }
        for (const [x0, y0] of tries){
          if (x0 + w + WALL > f.x1 || y0 + d + WALL > f.y1 || colInside(x0, y0, w, d)) continue;
          if (CL.some(c => hits({x:[x0, x0+w], y:[y0, y0+d]}, c))) continue;   // 门厅进场不能占
          const waste = (f.x1-f.x0) * (f.y1-f.y0) - w * d + (x0 - f.x0) + (y0 - f.y0);
          const ld = svc ? lightDist([x0 + w/2, y0 + d/2], FX) : 0;
          if (darkOnly && ld < RULE.light) break;            // 这一轮只要暗角
          const dark = svc ? -Math.min(RULE.light, ld) : 0;
          if (!best || dark < best.dark || (dark === best.dark && waste < best.waste)) best = {f, w, d, x0, y0, waste, dark};
          break;
        }
      }
    if (!best){ if (!darkOnly) out.push({...it, over:true}); continue; }
    done.add(it);
    const {f, w, d, x0, y0} = best;
    out.push({n:it.n, pax:it.pax, x:[Math.round(x0), Math.round(x0+w)], y:[Math.round(y0), Math.round(y0+d)]});
    // 用掉的那块从空闲表里切走：右边一条（隔墙相邻）、下边一条（中间留一条次通道，
    // 这样第二排房间的门也有走道可开，不会被第一排堵死）
    const nf = free.filter(z => z !== f);
    if (f.x1 - (x0 + w + WALL) > 800) nf.push({x0:x0+w+WALL, y0:f.y0, x1:f.x1, y1:f.y1});
    if (f.y1 - (y0 + d + cross) > 800) nf.push({x0:f.x0, y0:y0+d+cross, x1:x0+w+WALL, y1:f.y1});
    // 落位时往右／往下躲过障碍的话，让出来的上边和左边还能用
    if (y0 - f.y0 > 800) nf.push({x0:f.x0, y0:f.y0, x1:f.x1, y1:y0 - WALL});
    if (x0 - f.x0 > 800) nf.push({x0:f.x0, y0:y0, x1:x0 - WALL, y1:f.y1});
    free = nf;
  }
  return out;
}

/** 在一个矩形里铺工位带。横带（dir 'h'）沿 X 排、沿 Y 叠；竖带反过来。
    每张桌连同它的座椅 900 都不能压柱；每 P.seg 张桌断一条次通道（P.cross），全区对齐；
    带的末尾只剩一张桌深就铺单排（椅子朝通道那侧）；不足两张桌的零头不要。 */
function fillDesks(zone, size, dir, P){
  const [w, d] = size, H = dir === 'h';
  const U0 = H ? zone.x[0] : zone.y[0], U1 = H ? zone.x[1] : zone.y[1];
  const V0 = H ? zone.y[0] : zone.x[0], V1 = H ? zone.y[1] : zone.x[1];
  const R = (u0, u1, v0, v1) => H ? {x:[u0,u1], y:[v0,v1]} : {x:[v0,v1], y:[u0,u1]};
  const CS = colRects(), FX = fixedRects().concat(clearRects());
  const segLen = Math.max(1, P.seg) * w, out = [];
  const edge = k => k === 'win' ? RULE.head : k === 'corr' ? 0 : 900;
  // 横带：第一条带前留 —— 幕墙边 1200 采光通廊 / 其他 900 放椅子；竖带：靠墙留一把椅子的 900
  let v = V0 + (H ? Math.max(900, edge(zone.top)) : 900), single = false;
  // 竖带沿 y 的两端：幕墙边留通廊，通道边不留，墙边留 900
  const u0 = H ? U0 : U0 + edge(zone.top), u1 = H ? U1 : U1 - edge(zone.bot);
  while (true){
    let depth = d * 2;
    if (v + depth + RULE.trail > V1){ depth = d; single = true; if (v + depth + RULE.trail > V1) break; }
    const keep = [];
    for (let u = u0, i = 0; ; u += w, i++){
      const seg = Math.floor(i / Math.max(1, P.seg)), uu = u + seg * P.cross;
      if (uu + w > u1 + 1) break;
      const front = R(uu, uu + w, v - 900, v + d);
      const back  = single ? null : R(uu, uu + w, v + d, v + depth + 900);
      const bad = r => CS.some(c => hits(r, c)) || FX.some(f => hits(r, f));
      keep.push({u:uu, seg, ok: !bad(front) && !(back && bad(back))});
    }
    let run = [];
    const flush = () => {
      if (run.length >= 2) out.push({...R(run[0].u, run[run.length-1].u + w, v, v + depth),
                                     size:[w, d], dir, ...(single ? {face: H ? 'N' : 'W'} : {})});
      run = [];
    };
    for (const k of keep){
      const cont = run.length && k.seg === run[run.length-1].seg && Math.abs(k.u - run[run.length-1].u - w) < 1;
      if (k.ok && (cont || !run.length)) run.push(k); else { flush(); if (k.ok) run.push(k); }
    }
    flush();
    if (single) break;
    v += depth + RULE.chair;
  }
  return out;
}

/** 一块区的各种切法：全工位、全房间、西／东头 3~12 m 给房间、南边 3~6 m 给房间。
    南区顶上那条主通道永远留着，房间和工位都从通道南侧开始。 */
function splitsOf(z, P){
  const isS = z.n === '南区';
  // top/bot：这块地的上边、下边是什么 —— 幕墙（win）前要留 1200 采光通廊，
  // 通道（corr）边不用再留，墙（wall）边留 900 能走过去。
  const zz = {n:z.n, light:z.light, x:[z.x[0]+50, z.x[1]-50], y:[z.y[0] + (isS ? P.spine : 50), z.y[1]-50],
              top: isS ? 'corr' : (z.n === '北区' ? 'win' : 'wall'), bot: z.n === '北区' ? 'corr' : 'wall'};
  const W = zz.x[1]-zz.x[0], H = zz.y[1]-zz.y[0];
  const out = [{tag:'', room:[], desk:[zz]}, {tag:`${z.n}整块给房间`, room:[zz], desk:[]}];
  if (area(z) < 30) return out;                       // 拆出来的小块只有整给
  for (const w of [3000, 4500, 6000, 7500, 9000, 12000]) if (w <= W - 4500){
    out.push({tag:`${z.n}西头 ${w/1000} m 给房间`, room:[{...zz, x:[zz.x[0], zz.x[0]+w]}],
              desk:[{...zz, x:[zz.x[0]+w+P.cross, zz.x[1]]}]});
    out.push({tag:`${z.n}东头 ${w/1000} m 给房间`, room:[{...zz, x:[zz.x[1]-w, zz.x[1]]}],
              desk:[{...zz, x:[zz.x[0], zz.x[1]-w-P.cross]}]});
  }
  if (!isS) for (const h of [3000, 4500, 6000]) if (h <= H - 4500)
    out.push({tag:`${z.n}南边 ${h/1000} m 给房间`, room:[{...zz, y:[zz.y[1]-h, zz.y[1]]}],
              desk:[{...zz, y:[zz.y[0], zz.y[1]-h-P.cross], bot:'corr'}]});   // 房间前面那条次通道
  return out;
}

/** 需求 → 房间清单（尺寸按桌子反算） */
function wantRooms(P){
  const want = [];
  if (P.big) want.push({n:'大会议室', size: roomFor(P.big), pax: P.big});
  if (P.mid) want.push({n:'中会议室', size: roomFor(P.mid), pax: P.mid});
  for (let i = 0; i < P.tn; i++) want.push({n:'洽谈室', size: roomFor(P.tp), pax: P.tp});
  if (P.tea) want.push({n:'茶水间', size:[Math.round(Math.sqrt(P.tea*1e6*1.6)), Math.round(Math.sqrt(P.tea*1e6/1.6))]});
  if (P.print) want.push({n:'打印储物', size:[Math.round(Math.sqrt(P.print*1e6*1.5)), Math.round(Math.sqrt(P.print*1e6/1.5))]});
  for (let i = 0; i < P.booth; i++) want.push({n:'电话亭', size:[1200, 1500]});
  want.sort((a, b) => b.size[0]*b.size[1] - a.size[0]*a.size[1]);
  return want;
}

/** 超出目标就削：每次削最暗的那条带的最暗一端，一次一对；只差一个就留单排。 */
function trimTo(desks, N, blockers){
  const count = () => desks.reduce((a, b) => a + seatsOf(b).length, 0);
  let guard = 400;
  while (count() > N && guard--){
    let pick = null;
    for (const b of desks){
      const s = seatsOf(b), n = s.length; if (n < 4 && !b.face) continue; if (b.face && n < 3) continue;
      const H = (b.dir||'h') === 'h', w = (b.size||[1400,700])[0];
      for (const end of [0, 1]){
        const p = H ? [end ? b.x[1]-w/2 : b.x[0]+w/2, (b.y[0]+b.y[1])/2] : [(b.x[0]+b.x[1])/2, end ? b.y[1]-w/2 : b.y[0]+w/2];
        const dl = lightDist(p, blockers);
        if (!pick || dl > pick.dl) pick = {b, end, dl, H, w};
      }
    }
    if (!pick) break;
    const {b, end, H, w} = pick, over = count() - N;
    const k = H ? 'x' : 'y';
    if (over === 1 && !b.face){                       // 只多一个：末端那对留前排一张
      const nb = {...b, [k]: end ? [b[k][1]-w, b[k][1]] : [b[k][0], b[k][0]+w], face: H ? 'N' : 'W'};
      nb[H ? 'y' : 'x'] = H ? [b.y[0], b.y[0] + b.size[1]] : [b.x[0], b.x[0] + b.size[1]];
      desks.push(nb);
    }
    if (end) b[k][1] -= w; else b[k][0] += w;
  }
  return desks;
}

// 权重：seat 每个工位；short 每个没排到的工位；over 每间没落下的房（按人数放大，
// 丢一间 4 人洽谈比丢 14 人大会议轻）；lit 每个幕墙 6 m 内的工位；litRoom 房间占掉的
// 采光区每 ㎡；col 每根落在通行区里的柱；exit 疏散超 27.5 m 每米；frag 每条带；
// glare 每个正对／背对幕墙的工位（工位带朝向就是靠这一项选出来的）；
// win 房间挡掉的幕墙（按占这片立面的比例、再按服务人数打折）。
const PREF = {
  '均衡':     { seat:10, short:40, over:300, lit:3,  litRoom:0.15, col:30, exit:60, frag:1, glare:4, win:2 },
  '采光优先': { seat:10, short:40, over:300, lit:8,  litRoom:0.4,  col:30, exit:60, frag:1, glare:9, win:5 },
  '数量优先': { seat:10, short:80, over:300, lit:1,  litRoom:0.05, col:30, exit:60, frag:1, glare:1, win:1 },
  '房间优先': { seat:10, short:20, over:900, lit:3,  litRoom:0.15, col:30, exit:60, frag:1, glare:4, win:2 },
};

/** 给一版排布打分。返回带指标的对象。 */
function evaluate(rooms, over, desks, P, W){
  const blockers = rooms.concat(fixedRects());
  const seatsArr = desks.flatMap(b => seatsOf(b));
  const pts = seatsArr.map(mid);
  const seats = pts.length;
  const glare = glareCount(seatsArr);
  const lit = pts.filter(p => lightDist(p, blockers) <= RULE.light).length;
  // 房间占掉采光区的代价。打印、储物、电话亭这种没人久待的，占窗边按 20 倍算 ——
  // 不然 3 m 宽的西窗条正好塞得下它们，优化器会把最好的一段西向采光给了打印机。
  const litRoom = rooms.reduce((a, r) => a + (lightDist(mid(r), fixedRects()) <= RULE.light
    ? area(r) * (/打印|储物|电话/.test(r.n) ? 20 : 1) : 0), 0);
  const far = Math.max(0, ...pts.map(exitDist), ...rooms.map(r => exitDist(mid(r))));
  const CS = colRects();
  const colCirc = desks.reduce((a, b) => {                 // 柱子落在带两侧 1800 通行区里
    const H = (b.dir||'h') === 'h';
    const z = H ? {x:b.x, y:[b.y[0]-RULE.chair, b.y[1]+RULE.chair]} : {x:[b.x[0]-RULE.chair, b.x[1]+RULE.chair], y:b.y};
    return a + CS.filter(c => hits(z, c)).length; }, 0);
  const win = winEat(rooms);
  const shortBy = Math.max(0, P.N - seats);
  const overPen = over.reduce((a, o) => a + W.over * (0.5 + (o.pax || 8) / 16), 0);
  const score = W.seat * Math.min(seats, P.N) - W.short * shortBy - overPen
              + W.lit * lit - W.litRoom * litRoom - W.col * colCirc - W.glare * glare
              - W.win * win.pen
              - (far > BASE.egress_max ? W.exit * (far - BASE.egress_max) / 1000 : 0)
              - W.frag * desks.length;
  return { rooms, over, desks, seats, lit, litRoom, far, colCirc, glare, win, score };
}

/** 从门厅出发，人能不能走到每一条工位带、每一间房。

    「门厅进场」那块只是禁建框：它自己空着，但左边摆一间中会议室、下边摆一间洽谈室，
    出了门厅就是个死胡同 —— 实测排出来过这样一版。禁建框保证不了路通到底，得真走一遍。
    做法：150 mm 栅格标出障碍（房间、工位带、固定房、柱、壳外），做一次切比雪夫距离
    变换，离障碍够远的格子才算能走，再从门厅四连通洪水填充（对角挤不过去）。

    **判据是「过得去人」，不是「够 1200」。** 实测卡在 900 与 1050 之间：≤900 判堵，
    ≥1050 放行。想卡准 1200 做不到 —— 障碍按 floor~ceil 往外取整（房间之间 100 的
    隔墙全靠这个才不漏），一条缝最多被吃掉两格，NEED 调到 5 连 1200 都判堵了。
    1200 那个设计标准由「次通道」那一栏保证，这里管的是别出死路。 */
// 栅格 150：300 的时候障碍按 floor~ceil 往外取整，最多吃掉两格，
// 净宽判据实测卡在 900~1050 之间，跟号称的 1200 差了一格。
const GRID = 150, NEED = 4;
/** 每格所属通道的宽度。逐格的切比雪夫距离画出来是「离墙多远」的渐变 ——
    贴墙那一格永远接近 0，整张图边缘全是红的，看不出通道到底宽不宽。
    正确的做法是让每个内切圆把自己的直径盖到它覆盖的所有格子上，取最大值：
    走廊中心那个大圆一盖，整条走廊都是它的宽度。 */
function widthField(w){
  if (w.wf) return w.wf;
  const {D, W, H} = w, wf = new Int32Array(W * H);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++){
    const r = D[j*W+i];
    if (r < 1) continue;
    // 内切圆直径 (2r-1) 格，再补回一格 —— 障碍按 floor~ceil 外扩，实测系统性
    // 少 150（正好一格）：900→750、1200→1050、1800→1650，补完全部对上。
    const v = 2 * r * GRID, rr = r - 1;
    for (let b = Math.max(0, j-rr); b <= Math.min(H-1, j+rr); b++)
      for (let a = Math.max(0, i-rr); a <= Math.min(W-1, i+rr); a++){
        const k = b*W+a; if (wf[k] < v) wf[k] = v;
      }
  }
  return (w.wf = wf);
}

function reach(rooms, desks, deep){
  const S = BASE.shell, X0 = S.x0, Y0 = S.y0;
  const W = Math.ceil((S.x1 - X0) / GRID), H = Math.ceil((S.y1 - Y0) / GRID);
  const blk = new Uint8Array(W * H);
  const mark = o => {
    for (let i = Math.max(0, Math.floor((o.x[0]-X0)/GRID)); i < Math.min(W, Math.ceil((o.x[1]-X0)/GRID)); i++)
      for (let j = Math.max(0, Math.floor((o.y[0]-Y0)/GRID)); j < Math.min(H, Math.ceil((o.y[1]-Y0)/GRID)); j++)
        blk[j*W+i] = 1; };
  rooms.forEach(mark); desks.forEach(mark);
  BASE.rooms.filter(r => !gone(r.n)).forEach(mark);
  BASE.columns.forEach(c => mark({x:[c.x, c.x+c.w], y:[c.y, c.y+c.d]}));
  // 壳外也当障碍
  for (let i = 0; i < W; i++) for (let j = 0; j < H; j++){
    const x = X0 + i*GRID, y = Y0 + j*GRID;
    if (x < S.x0 + 150 || x > S.x1 - 150 || y < S.y0 + 150 || y > S.y1 - 150) blk[j*W+i] = 1; }
  // 切比雪夫距离变换（格数）
  const D = new Int32Array(W * H);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++){
    const k = j*W+i;
    if (blk[k]){ D[k] = 0; continue; }
    let v = 1e6;
    if (i) v = Math.min(v, D[k-1] + 1);
    if (j) v = Math.min(v, D[k-W] + 1);
    if (i && j) v = Math.min(v, D[k-W-1] + 1);
    if (i < W-1 && j) v = Math.min(v, D[k-W+1] + 1);
    D[k] = v; }
  for (let j = H-1; j >= 0; j--) for (let i = W-1; i >= 0; i--){
    const k = j*W+i; if (!blk[k]){
      let v = D[k];
      if (i < W-1) v = Math.min(v, D[k+1] + 1);
      if (j < H-1) v = Math.min(v, D[k+W] + 1);
      if (i < W-1 && j < H-1) v = Math.min(v, D[k+W+1] + 1);
      if (i && j < H-1) v = Math.min(v, D[k+W-1] + 1);
      D[k] = v; } }
  const pass = k => !blk[k] && D[k] >= NEED;
  // 从门厅中心起步
  const E = BASE.entry, si = Math.floor(((E.x[0]+E.x[1])/2 - X0)/GRID), sj = Math.floor(((E.y[0]+E.y[1])/2 - Y0)/GRID);
  const seen = new Uint8Array(W * H), q = [];
  for (let di = -3; di <= 3; di++) for (let dj = -3; dj <= 3; dj++){
    const i = si+di, j = sj+dj, k = j*W+i;
    if (i>=0 && i<W && j>=0 && j<H && !blk[k] && !seen[k]){ seen[k] = 1; q.push(k); } }
  while (q.length){ const k = q.pop(), i = k % W, j = (k-i)/W;
    for (const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){ const a = i+di, c = j+dj;
      if (a<0||a>=W||c<0||c>=H) continue; const t = c*W+a;
      if (seen[t] || !pass(t)) continue; seen[t] = 1; q.push(t); } }
  // 四条边各自往外看 R 格有没有走得到的格子。**只看正对着的那一条，不看四个角** ——
  // 原来是拿外扩后的整个矩形框去搜，角上的格子也算数，于是「只有对角能过」的房间
  // （人根本挤不过去）被判成通的。实测过：那一版报 0 处走不到。
  const R = 8;
  const near = o => {
    const i0 = Math.floor((o.x[0]-X0)/GRID), i1 = Math.ceil((o.x[1]-X0)/GRID);
    const j0 = Math.floor((o.y[0]-Y0)/GRID), j1 = Math.ceil((o.y[1]-Y0)/GRID);
    for (let i = Math.max(0,i0); i < Math.min(W,i1); i++){
      for (let j = Math.max(0,j0-R); j < j0; j++) if (seen[j*W+i]) return true;
      for (let j = j1; j < Math.min(H,j1+R); j++) if (seen[j*W+i]) return true;
    }
    for (let j = Math.max(0,j0); j < Math.min(H,j1); j++){
      for (let i = Math.max(0,i0-R); i < i0; i++) if (seen[j*W+i]) return true;
      for (let i = i1; i < Math.min(W,i1+R); i++) if (seen[j*W+i]) return true;
    }
    return false; };
  const lost = rooms.filter(r => !near(r)).length + desks.filter(d => !near(d)).length;

  // 疏散距离：沿能走的格子从疏散口算，不是直线。直线量出来的数偏乐观 ——
  // 真人得绕着家具走，而 27.5 m（喷淋保护上限）是报审的硬约束，乐观不得。
  // 正交一步记 5、斜走记 7（≈√2×5，误差 1%），桶排序当优先队列。
  // deep 时才算通道宽度场（一次膨胀，约 20 ms）—— 生成时几千个候选跑不起，
  // 只有画布下面那条校核栏和动线染色需要。
  const wideRaw = k => 2 * D[k] * GRID;
  let wf = null;
  const wide = k => wf ? wf[k] : wideRaw(k);
  if (deep) wf = widthField({D, W, H});
  const INF = 1 << 28, cost = new Int32Array(W * H).fill(INF), bucket = [];
  // bott[k] = 从疏散口走最短路到这格，路上最窄的地方有多宽
  const bott = new Int32Array(W * H).fill(INF);
  const push = (k, c) => { (bucket[c] = bucket[c] || []).push(k); };
  for (const e of BASE.exits){
    const ei = Math.round((e.x - X0)/GRID), ej = Math.round((e.y - Y0)/GRID);
    for (let di = -10; di <= 10; di++) for (let dj = -10; dj <= 10; dj++){
      const i = ei+di, j = ej+dj;
      if (i<0||i>=W||j<0||j>=H) continue;
      const k = j*W+i;
      if (pass(k) && cost[k]){ cost[k] = 0; bott[k] = wide(k); push(k, 0); }
    }
  }
  const STEP = [[1,0,5],[-1,0,5],[0,1,5],[0,-1,5],[1,1,7],[1,-1,7],[-1,1,7],[-1,-1,7]];
  for (let c = 0; c < bucket.length; c++){
    const bag = bucket[c]; if (!bag) continue;
    for (const k of bag){
      if (cost[k] !== c) continue;                    // 已经有更短的路了
      const i = k % W, j = (k - i) / W;
      for (const [di, dj, w] of STEP){
        const a = i+di, b2 = j+dj;
        if (a<0||a>=W||b2<0||b2>=H) continue;
        const t = b2*W+a;
        if (!pass(t) || cost[t] <= c + w) continue;
        cost[t] = c + w; bott[t] = Math.min(bott[k], wide(t)); push(t, c + w);
      }
    }
    bucket[c] = null;
  }
  // 每个东西取它四条边外侧最近的那格的步行距离
  const walkTo = o => {
    const i0 = Math.floor((o.x[0]-X0)/GRID), i1 = Math.ceil((o.x[1]-X0)/GRID);
    const j0 = Math.floor((o.y[0]-Y0)/GRID), j1 = Math.ceil((o.y[1]-Y0)/GRID);
    let m = INF, best = -1;
    const take = k => { if (cost[k] < m){ m = cost[k]; best = k; } };
    for (let i = Math.max(0,i0); i < Math.min(W,i1); i++){
      for (let j = Math.max(0,j0-R); j < j0; j++) take(j*W+i);
      for (let j = j1; j < Math.min(H,j1+R); j++) take(j*W+i);
    }
    for (let j = Math.max(0,j0); j < Math.min(H,j1); j++){
      for (let i = Math.max(0,i0-R); i < i0; i++) take(j*W+i);
      for (let i = i1; i < Math.min(W,i1+R); i++) take(j*W+i);
    }
    return m >= INF ? null : { d: m / 5 * GRID, bott: bott[best], k: best }; };
  // 最远疏散，和「疏散路上最窄的地方」—— 后者才是有意义的窄点。整个可达面积里的
  // 最小净宽没用：墙角那种谁也不走的小兜子也会被算进去。
  let far = 0, farOf = null, narrow = INF, narrowAt = null;
  for (const o of rooms.concat(desks)){
    const w2 = walkTo(o);
    if (!w2) continue;
    if (w2.d > far){ far = w2.d; farOf = o.n || '工位带'; }
    if (w2.bott < narrow){ narrow = w2.bott;
      narrowAt = [X0 + (w2.k % W) * GRID, Y0 + Math.floor(w2.k / W) * GRID]; }
  }
  return { lost, total: rooms.length + desks.length, far, farOf,
           narrow: (deep && narrow < INF) ? narrow : null, narrowAt,
           seen, D, wf, wide, W, H, X0, Y0 };
}

/** 两块上下挨着的地都排工位时，把它们并成一块，让工位带能穿过去。

    北区到 y=10652 止、南区从 y=10751 起，可 y=10700 那条线是**原宿舍隔墙**，
    本来就在要拆的清单里 —— 把它当成分区界线，工位带就永远跨不过去。
    甲方 PLAN A 有三条带 y 7250~12850 正是横穿这条线的，生成器一条都排不出来。
    并起来只是多一个待选项，好不好由打分说了算。 */
function mergeThrough(rects){
  for (let i = 0; i < rects.length; i++)
    for (let j = 0; j < rects.length; j++){
      if (i === j) continue;
      const a = rects[i], b = rects[j];
      if (b.y[0] < a.y[1] || b.y[0] - a.y[1] > 2200) continue;      // b 得紧挨在 a 下面
      const x0 = Math.max(a.x[0], b.x[0]), x1 = Math.min(a.x[1], b.x[1]);
      if (x1 - x0 < 5000) continue;                                 // 搭得太少不值当
      const out = rects.filter((_, k) => k !== i && k !== j);
      out.push({n:`${a.n}+${b.n}打通`, light:a.light || b.light,
                x:[x0, x1], y:[a.y[0], b.y[1]], top:a.top, bot:b.bot});
      for (const [r, keep] of [[a, a.top], [b, b.bot]]){            // 两边多出来的边条还能用
        if (r.x[1] - x1 > 3000) out.push({...r, x:[x1, r.x[1]]});
        if (x0 - r.x[0] > 3000) out.push({...r, x:[r.x[0], x0]});
      }
      return out;
    }
  return null;
}

/** n 块地各自横排／竖排的组合。块少就全枚举，块多了只试「全横／全竖／逐块混排」。 */
function orientCombos(n){
  if (n === 0) return [[]];
  if (n <= 3){
    const out = [];
    for (let m = 0; m < (1 << n); m++)
      out.push([...Array(n)].map((_, i) => (m >> i) & 1 ? 'v' : 'h'));
    return out;
  }
  return [Array(n).fill('h'), Array(n).fill('v')];
}

/** 主入口：枚举所有切法，真排、打分、排序。 */
function generate(P){
  const zones = BASE.free.filter(unlocked);
  const want = wantRooms(P);
  const need = want.reduce((a, it) => a + (it.size[0]+100) * (it.size[1]+100), 0);
  const W = PREF[P.pref] || PREF['均衡'];
  const lists = zones.map(z => splitsOf(z, P));
  const idx = lists.map(() => 0), out = [];
  const seen = new Set();
  for (;;){
    const plan = lists.map((l, i) => l[idx[i]]);
    const roomRects = plan.flatMap(p => p.room), deskRects = plan.flatMap(p => p.desk);
    const cap = roomRects.reduce((a, r) => a + (r.x[1]-r.x[0]) * (r.y[1]-r.y[0]), 0);
    // 房间面积明显不够、或者给房间的地方是需要的三倍以上，都不用试
    const worth = need === 0 ? roomRects.length === 0 : (cap >= need && cap <= need * 3);
    if (worth){
      const placed = pack(roomRects, want, P.cross);
      const rooms = placed.filter(p => !p.over).map(p => ({n:p.n, x:p.x, y:p.y}));
      const over = placed.filter(p => p.over);
      // 每块地的横排／竖排都是一个待选项，交给打分决定 —— 原来是按工位数贪心先挑掉，
      // 朝向根本进不了打分。这层楼北立面 16.2 m 满玻：横排只有第一排贴窗，竖排每条带
      // 都够得到窗，采光差一大截，光靠数工位是选不出来的。
      const blockers = rooms.concat(fixedRects());
      const merged = P.N > 0 ? mergeThrough(deskRects) : null;
      for (const rects of (merged ? [deskRects, merged] : [deskRects])){
      const fills = P.N > 0 ? rects.map(z => ({n:z.n, h:fillDesks(z, P.size, 'h', P), v:fillDesks(z, P.size, 'v', P)})) : [];
      for (const combo of orientCombos(fills.length)){
        const desks = combo.flatMap((k, i) => fills[i][k].map(b => ({...b, x:[...b.x], y:[...b.y]})));
        const capSeats = desks.reduce((a, b) => a + seatsOf(b).length, 0);
        const ev = evaluate(rooms, over, trimTo(desks, P.N, blockers), P, W);
        const key = JSON.stringify([ev.seats, ev.lit, rooms.map(r => [r.n, r.x, r.y]), combo]);
        if (seen.has(key)) continue;
        seen.add(key);
        const dt = fills.filter((f, i) => f[combo[i]].length).map((f, i) => `${f.n}${combo[i] === 'v' ? '竖' : '横'}排`);
        out.push({...ev, capSeats,
          tag: plan.map(p => p.tag).filter(Boolean).concat(dt).join('；') || '整层给工位'});
      }
      }
    }
    let k = 0; while (k < idx.length){ idx[k]++; if (idx[k] < lists[k].length) break; idx[k] = 0; k++; }
    if (k === idx.length) break;
  }
  out.sort((a, b) => b.score - a.score);
  // 走一遍太贵，不可能几千个候选都跑。先按原打分排序，只查前 60；被罚下去之后
  // 原来 60 名开外的会顶上来，所以要再查一轮，直到前 60 全查过 —— 不然冠军
  // 有可能是个没查过的。
  for (let pass = 0; pass < 5; pass++){
    const todo = out.slice(0, 60).filter(c => !c.walk);
    if (!todo.length) break;
    for (const c of todo){
      c.walk = reach(c.rooms, c.desks);
      c.score -= 600 * c.walk.lost;
      // 直线疏散是几千个候选都要算的便宜筛子；进了前 60 就换成沿走道的真实距离，
      // 把当初按直线记的那笔罚款退掉、按真数重记。
      if (c.walk.far){
        const pen = d => d > BASE.egress_max ? W.exit * (d - BASE.egress_max) / 1000 : 0;
        c.score += pen(c.far) - pen(c.walk.far);
        c.far = c.walk.far; c.farOf = c.walk.farOf; c.farWalk = true;
      }
    }
    out.sort((a, b) => b.score - a.score);
  }
  return out;
}

let CANDS = [];
function readP(){
  return { N: +$('#q_seat').value, size: $('#q_desk').value.split(',').map(Number),
    big: +$('#q_big').value, mid: +$('#q_mid').value, tn: +$('#q_tn').value, tp: +$('#q_tp').value,
    tea: +$('#q_tea').value, print: +$('#q_print').value, booth: +$('#q_booth').value,
    spine: +$('#q_spine').value, cross: +$('#q_cross').value, seg: +$('#q_seg').value,
    pref: $('#q_pref').value };
}
function useCand(i){
  const c = CANDS[i]; if (!c) return;
  const P = readP();
  SCH = {id:'需求', name:`按需求生成 · ${P.N} 工位`, demolish: SCH.demolish || [], halls: SCH.halls || [],
         rooms: c.rooms.map(r => ({n:r.n, x:[...r.x], y:[...r.y]})),
         desks: c.desks.map(d => ({...d, x:[...d.x], y:[...d.y], size:[...d.size]}))};
  sel = null; sync();
  const lines = [
    `<b>${c.tag}</b>`,
    `工位 <b>${c.seats}</b> / 目标 ${P.N}` + (c.seats < P.N ? '　← 排不下了' : c.capSeats > P.N ? `　（这版最多能排 ${c.capSeats}）` : ''),
    `采光 <b>${c.seats ? Math.round(100*c.lit/c.seats) : 0}%</b> 的工位在幕墙 6 m 内`,
    `最远疏散${c.farWalk ? '（沿走道' + (c.farOf ? '，' + c.farOf : '') + '）' : '（直线，未细算）'}`
      + ` <b>${(c.far/1000).toFixed(1)} m</b>`
      + (c.far > BASE.egress_max ? ' <span style="color:var(--warn)">超 27.5</span>' : ' ✓'),
    c.colCirc ? `<span style="color:var(--warn)">${c.colCirc} 根柱子落在通行区里</span>` : '柱子都避开了',
    c.glare ? `<span style="color:var(--warn)">${c.glare} 个工位正对／背对幕墙（眩光）</span>`
            : '没有工位正对幕墙 ✓',
    c.walk ? (c.walk.lost ? `<span style="color:var(--warn)">从门厅有 ${c.walk.lost} 处走不到（路被堵死）</span>`
                          : '从门厅走得到每一处 ✓') : '',
    (() => { const q = c.win.pct, bad = Math.max(q.north, q.west, q.south) > 0.25;
      const t = ['north','west','south'].filter(k => q[k] > 0.01)
        .map(k => `${{north:'北',west:'西',south:'南'}[k]} ${Math.round(100*q[k])}%`).join('　');
      return t ? `${bad ? '<span style="color:var(--warn)">' : ''}房间挡窗：${t}${bad ? '　← 西立面总共才 6.3 m</span>' : ''}`
               : '房间没占幕墙 ✓'; })(),
    ...c.rooms.map(r => { const s = seatsIn(r);
      return `${r.n} ${(r.x[1]-r.x[0])}×${(r.y[1]-r.y[0])}　${s && !/茶水|打印|电话/.test(r.n) ? s + ' 人' : (area(r).toFixed(1)+' ㎡')}`; })];
  if (c.over.length) lines.push(`<b style="color:var(--warn)">放不下：${c.over.map(o=>o.n).join('、')}</b>`
    + ((SCH.demolish||[]).length < 4 ? '<br>点一下图上标「可拆」的房间可以拆掉它，再试一次' : ''));
  $('#q_out').innerHTML = lines.join('<br>');
  // 其他排法
  const alt = CANDS.slice(0, 8).map((k, j) => `<button class="${j===i?'on':''}" data-i="${j}">`
    + `${k.seats} 位 · 采光 ${k.seats ? Math.round(100*k.lit/k.seats) : 0}%` + (k.over.length ? ` · 缺 ${k.over.length} 间` : '')
    + (k.colCirc ? ' · 压柱' : '') + (k.glare ? ` · 眩光 ${k.glare}` : '')
    + (Math.max(k.win.pct.north, k.win.pct.west, k.win.pct.south) > 0.25 ? ' · 挡窗' : '')
    + (k.walk && k.walk.lost ? ` · 堵路 ${k.walk.lost}` : '')
    + `<small>${k.tag}</small></button>`).join('');
  $('#q_alt').innerHTML = CANDS.length > 1 ? `<div class="f" style="margin-top:10px">其他排法（共试了 ${CANDS.length} 种）</div>${alt}` : '';
  for (const b of $('#q_alt').querySelectorAll('button')) b.onclick = () => useCand(+b.dataset.i);
}

$('#q_go').onclick = () => {
  const P = readP();
  const t0 = performance.now();
  CANDS = generate(P);
  const ms = Math.round(performance.now() - t0);
  if (!CANDS.length){ $('#q_out').innerHTML = '一种切法都排不出来 —— 可变区是不是全被锁着？'; return; }
  useCand(0);
  show(`试了 ${CANDS.length} 种分法（${ms} ms），按「${P.pref}」挑了最好的一种。右边列着其他几种，点一下就换。`
     + '会议室是按桌子反算的：端部净距 1200、侧向 1200、沿桌长每人 750。');
};

$('#load').onchange = async e => {
  const v = e.target.value; e.target.value = '';
  if (!v) return;
  if (v === '_'){ SCH = blank(); sel = null; sync();
    return show(`空白方案。默认已拆：${allDemo().join('、')} —— 想留哪间在图上点一下。`); }
  const r = await fetch(`schemes/${v}.json`);
  SCH = await r.json();
  SCH.desks = SCH.desks.map(d => ({...d, size:d.size||[1400,700], dir:d.dir||'h'}));
  SCH.halls = SCH.halls || [];
  sel = null; sync();
  const dm = (SCH.demolish || []);
  show(`已载入 ${SCH.name} —— 房间 ${SCH.rooms.length} 间、工位带 ${SCH.desks.length} 条`
     + (dm.length ? `，已拆 ${dm.join('、')}` : '') + '。'
     + '这是从甲方 PDF 导进来的草稿，位置可以直接拖着改。');
};
$('#exp').onclick = () => {
  const out = {...SCH, seats: seatCount()};
  const s = JSON.stringify(out, null, 1);
  navigator.clipboard?.writeText(s).catch(()=>{});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([s], {type:'application/json'}));
  a.download = `scheme_${SCH.id || '新'}.json`; a.click();
  show(`已导出，同时复制到剪贴板。工位 ${seatCount()} 个、房间 ${SCH.rooms.length} 间。`
     + '把它放进仓库 schemes/ 就能出白模和 AI 底图。');
};
$('#save').onclick = async () => {
  const id = $('#sid').value.trim();
  if (!/^[A-Za-z0-9]{1,8}$/.test(id)) return show('方案号只能是字母数字，1~8 位');
  show('存进仓库…');
  try{
    const r = await fetch('api/scheme', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pin: sessionStorage.getItem('pin'), id,
                            scheme: {...SCH, id, seats: seatCount()}})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    show(j.note || `已存成 schemes/${id}.json`);
  }catch(e){ show('存不进去：' + e.message + '　可以先「导出文件」自己放进仓库'); }
};
function show(t){ const m = $('#msg'); m.className = 'msg on'; m.textContent = t; }

// ---- 门禁（和另外两页共用一个码）
(function(){
  const gate = $('#pgate'), err = $('#perr');
  const open = async () => { gate.hidden = true; document.body.style.overflow = '';
    BASE = await (await fetch('models/base.json')).json();
    SCH = blank();                       // BASE 到手才知道哪几间是可拆的
    layout(); setTool('sel'); sync();
    addEventListener('resize', () => { layout(); draw(); }); };
  const check = async v => (await fetch('api/generate', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pin:v, view:'__check__', prompt:'x'})})).status !== 401;
  $('#pgo').onclick = async () => {
    const v = $('#ppin').value.trim();
    if (!/^\d{4}$/.test(v)) return err.textContent = '请输入四位数字';
    err.textContent = '校验中…';
    try { if (await check(v)){ sessionStorage.setItem('pin', v); err.textContent=''; open(); }
          else err.textContent = '门禁码不对'; }
    catch(e){ err.textContent = '连不上服务端：' + e.message; }
  };
  $('#ppin').onkeydown = e => { if (e.key === 'Enter') $('#pgo').click(); };
  document.body.style.overflow = 'hidden';
  const saved = sessionStorage.getItem('pin');
  if (/^\d{4}$/.test(saved || '')){
    err.textContent = '校验中…';
    check(saved).then(ok => ok ? (err.textContent='', open())
                               : (err.textContent='门禁码不对', $('#ppin').focus()))
                .catch(() => { err.textContent = '连不上服务端，手动输一次'; $('#ppin').focus(); });
  } else $('#ppin').focus();
})();
</script>
